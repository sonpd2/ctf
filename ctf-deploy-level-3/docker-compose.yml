services:
  ctf:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CTF_SEED: ""
    expose:
      - "3000"
    environment:
      ADMIN_USER: "admin"
      ADMIN_PASS: "change-me"
      SHARE_FILES_DIR: "/shared"
    volumes:
      - ctf-data:/app/data
      - ctf-files:/shared
    healthcheck:
      test: ["CMD", "test", "-f", "/shared/incident/var/log/nginx/access.log"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  web:
    build: ./web
    expose:
      - "80"
    volumes:
      - ctf-files:/shared:ro
    depends_on:
      ctf:
        condition: service_healthy
    restart: unless-stopped

  shell:
    build:
      context: ./shell
      dockerfile: Dockerfile
    ports:
      - "8080:7681"
    environment:
      CTF_API: "http://ctf:3000"
      WEB_URL: "http://127.0.0.1"
      WEB_UPSTREAM: "web:80"
    volumes:
      - ctf-files:/srv/challenges:ro
    read_only: true
    tmpfs:
      - /tmp
      - /run
    security_opt:
      - no-new-privileges:true
      - seccomp:unconfined
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - NET_BIND_SERVICE   # socat listen :80
    pids_limit: 512
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      ctf:
        condition: service_healthy
      web:
        condition: service_started
    restart: unless-stopped

  # Write-up HTML (spoilers) — http://<ip>:8082/write-up/
  writeup:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./write-up:/usr/share/nginx/html:ro
      - ./writeup-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  ctf-data:
  ctf-files:
